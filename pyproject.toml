[project]
name = "nakama"
version = "0.1.0"
description = "Self-hosted fleet of single-purpose Claude agents (inspired by Anthropic Japan's BDR workflow)"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.189,<0.3",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nakama"]

[tool.setuptools.package-data]
nakama = ["static/*.html"]

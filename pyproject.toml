[project]
name = "nakama"
version = "0.1.0"
description = "Self-hosted fleet of single-purpose Claude agents (inspired by Anthropic Japan's BDR workflow)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "claude-agent-sdk>=0.2.189,<0.3",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "openpyxl>=3.1",  # credit tab: import past months from a hand-made workbook
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Excel (WBS, chat Excel reader) and PowerPoint (deck review) support
office = ["openpyxl>=3.1,<4", "python-pptx>=1.0,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nakama", "nakama.helpers"]

[tool.setuptools.package-data]
nakama = ["static/*.html", "data/*.json", "data/*.md"]

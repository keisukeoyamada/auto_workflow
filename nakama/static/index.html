<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nakama</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
    --accent: #2f6fde; --accent-soft: #e8f0fd; --ok: #1f8a4c; --warn: #b26b00; --bad: #c4352b;
    --code: #f1f3f6; --radius: 10px;
    --off: rgba(196, 53, 43, .22); --partial: rgba(178, 107, 0, .20);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --text: #e6e9ef; --muted: #98a1b3; --line: #2a303c;
      --accent: #6b9cff; --accent-soft: #1e2a42; --ok: #4cc583; --warn: #f0a63a; --bad: #ff6b60;
      --code: #222733;
      --off: rgba(255, 107, 96, .30); --partial: rgba(240, 166, 58, .26);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
           padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  header .meta { color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  nav, .navwrap > nav { display: flex; gap: 4px; padding: 8px 20px 0; flex-wrap: wrap; }
  nav button { border: 0; background: none; color: var(--muted); padding: 8px 12px; cursor: pointer;
               border-radius: 8px 8px 0 0; font: inherit; }
  nav button.active { color: var(--accent); background: var(--panel); font-weight: 600; }
  nav .badge { background: var(--bad); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
  main { padding: 12px 20px 40px; }
  .tabdesc { padding: 10px 20px 0; color: var(--muted); font-size: 13px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; }
  .tile .label { color: var(--muted); font-size: 12px; }
  .tile .value { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .meter { height: 6px; background: var(--line); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num { font-variant-numeric: tabular-nums; }
  .tablewrap { overflow-x: auto; }
  .pill { display: inline-block; padding: 0 8px; border-radius: 9px; font-size: 12px; background: var(--code); color: var(--muted); }
  .pill.open, .pill.new, .pill.running { background: var(--accent-soft); color: var(--accent); }
  .pill.done, .pill.ok { color: var(--ok); }
  .pill.waiting, .pill.escalated { color: var(--warn); }
  .pill.off { color: var(--bad); }
  button.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 7px;
               padding: 4px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn:disabled { opacity: .5; cursor: default; }
  .split { display: grid; grid-template-columns: minmax(240px, 360px) 1fr; gap: 16px; }
  @media (max-width: 760px) { .split { grid-template-columns: 1fr; } }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); max-height: 75vh; overflow: auto; }
  .list .item { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .list .item:hover { background: var(--accent-soft); }
  .list .item.active { background: var(--accent-soft); border-left: 3px solid var(--accent); }
  .list .item .t { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .item .s { color: var(--muted); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .viewer { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; min-height: 300px; overflow-wrap: anywhere; }
  .viewer .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px;
                     padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .viewer .path { color: var(--muted); font-size: 12px; margin-right: auto; }
  .md h1, .md h2, .md h3 { margin: 1em 0 .4em; line-height: 1.3; } .md h1 { font-size: 19px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14px; }
  .md blockquote { margin: 0 0 12px; padding: 8px 12px; border-left: 3px solid var(--warn); background: var(--code); border-radius: 0 6px 6px 0; }
  .md pre, .md code { background: var(--code); border-radius: 6px; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
  .md pre { padding: 10px 12px; overflow: auto; } .md code { padding: 1px 4px; } .md pre code { padding: 0; }
  .md table { margin: 8px 0; } .md p { margin: 0 0 10px; }
  .fm { font-size: 12px; color: var(--muted); background: var(--code); border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; white-space: pre-wrap; }
  textarea { width: 100%; min-height: 90px; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
             background: var(--panel); color: var(--text); font: inherit; }
  .cal th, .cal td { text-align: center; padding: 4px 2px; min-width: 34px; font-size: 12px; border: 1px solid var(--line); }
  .cal td.name, .cal th.name { text-align: left; white-space: nowrap; padding: 4px 8px; min-width: 0;
                               position: sticky; left: 0; background: var(--panel); z-index: 1; }
  .cal .past { opacity: .55; }
  textarea.editor { min-height: 60vh; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
  .cal .we { background: var(--code); color: var(--muted); }
  .cal .off { background: var(--off); font-weight: 600; } .cal .partial { background: var(--partial); }
  .cal .today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cal-legend { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  .cal-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
  .agents-mini { display: flex; flex-wrap: wrap; gap: 8px; }
  .agents-mini .chip { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px 4px 10px; }
  .card h2 .right { float: right; }
  .dash { display: grid; gap: 16px; align-items: start;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(260px, 340px);
          grid-template-areas: "agents tasks esc" "cal sched esc" "recent recent esc"; }
  .dash > .card { margin: 0; min-width: 0; }
  .dash .sq { aspect-ratio: 1 / 1; overflow: auto; }
  .dash .rightcol { grid-area: esc; position: sticky; top: 12px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .dash .rightcol > .card { margin: 0; }
  .dash .esc { max-height: calc(60vh); overflow: auto; }
  @media (max-width: 1100px) { .dash { grid-template-columns: 1fr 1fr; grid-template-areas: "agents tasks" "esc esc" "cal sched" "recent recent"; }
                               .dash .rightcol { position: static; } .dash .esc { max-height: none; } }
  @media (max-width: 760px) { .dash { grid-template-columns: 1fr; grid-template-areas: "agents" "tasks" "esc" "cal" "sched" "recent"; }
                              .dash .sq { aspect-ratio: auto; } }
  .agent-row { display: flex; align-items: center; gap: 8px; padding: 7px 2px; border-bottom: 1px solid var(--line); }
  .agent-row .when { color: var(--muted); font-size: 12px; margin-left: auto; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.run { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); } .dot.off { background: var(--muted); }
  .esc h3 { font-size: 13px; margin: 12px 0 4px; } .esc ul { margin: 0; padding-left: 18px; } .esc li { margin: 2px 0; }
  .esc .attn { background: var(--partial); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
  .esc .muted { color: var(--muted); font-size: 12px; } .esc details { margin-top: 6px; } .esc summary { cursor: pointer; }
  /* schedule timeline */
  .tl { position: relative; }
  .tl-row { display: grid; grid-template-columns: 78px 1fr; align-items: center; height: 13px; font-size: 10.5px; }
  .card.small h2 { font-size: 13px; margin-bottom: 6px; } .card.small .cal-legend { font-size: 11px; }
  .tl-row .nm { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-track { position: relative; height: 9px; border-bottom: 1px dashed var(--line); }
  .tl-mark { position: absolute; top: 2px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%;
             border: 1px solid var(--muted); background: var(--panel); }
  .tl-mark.past { opacity: .35; }
  .tl-run { position: absolute; top: 0; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--ok); }
  .tl-run.err { background: var(--bad); }
  .tl-now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); }
  .tl-axis { display: grid; grid-template-columns: 78px 1fr; font-size: 10px; color: var(--muted); }
  .tl-axis .ticks { position: relative; height: 14px; } .tl-axis .ticks span { position: absolute; transform: translateX(-50%); }
  /* flow diagram */
  svg.flow { width: 100%; height: auto; display: block; }
  svg.flow text { font: 12px system-ui, sans-serif; fill: var(--text); }
  svg.flow .sub { fill: var(--muted); font-size: 10.5px; }
  svg.flow .node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
  svg.flow .node.err rect { stroke: var(--bad); stroke-width: 2.5; }
  svg.flow .node.run rect { stroke: var(--accent); stroke-width: 2.5; }
  svg.flow .node.off rect { stroke-dasharray: 4 3; } svg.flow .node.off text { fill: var(--muted); }
  svg.flow .edge { fill: none; stroke: var(--line); stroke-width: 1.5; }
  svg.flow .edge.wait { stroke: var(--warn); stroke-width: 2.5; }
  svg.flow .badge rect { fill: var(--warn); } svg.flow .badge text { fill: #fff; font-size: 11px; font-weight: 700; }
  svg.flow .sink rect { fill: var(--code); stroke: var(--line); }
  svg.flow .sink.wait rect { stroke: var(--warn); stroke-width: 2.5; }
  svg.flow .play { cursor: pointer; } svg.flow .play circle { fill: var(--accent-soft); } svg.flow .play path { fill: var(--accent); }
  svg.flow .play:hover circle { fill: var(--accent); } svg.flow .play:hover path { fill: #fff; }
  /* notification feed */
  .nhead { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .ngroup { color: var(--muted); font-size: 11px; margin: 10px 0 2px; text-transform: none; }
  .nrow { display: flex; align-items: center; gap: 6px; padding: 5px 4px; border-radius: 6px; cursor: pointer; }
  .nrow:hover { background: var(--accent-soft); }
  .nrow .ic { width: 20px; text-align: center; flex: none; }
  .nrow .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nrow.acked .tt { color: var(--muted); text-decoration: line-through; }
  .nrow .ok { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 6px; font-size: 11px; padding: 0 6px; cursor: pointer; }
  .nrow .ok:hover { color: var(--ok); border-color: var(--ok); }
  .ndetail { margin: 0 0 6px 26px; padding: 6px 8px; border-left: 2px solid var(--line); font-size: 12.5px; }
  .ndetail .md { max-height: 260px; overflow: auto; }
  .ndetail a.btn { display: inline-block; margin: 4px 6px 0 0; text-decoration: none; }
  /* compact task table */
  table.tasks td.due { white-space: nowrap; } table.tasks a { color: inherit; } table.tasks a:hover { color: var(--accent); }
  .memo-list { margin-top: 6px; font-size: 12.5px; }
  .memo-list div { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .memo-list .when { color: var(--muted); flex: none; } .memo-list .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  textarea#memo-text { min-height: 54px; }
  /* chat side panel */
  body.chat-open { margin-right: 33vw; }
  #chatpanel { position: fixed; top: 0; right: 0; width: 33vw; min-width: 320px; height: 100vh; background: var(--panel);
               border-left: 1px solid var(--line); display: none; flex-direction: column; z-index: 20; }
  body.chat-open #chatpanel { display: flex; }
  @media (max-width: 960px) { body.chat-open { margin-right: 0; } #chatpanel { width: 100vw; } }
  #chatpanel .chead { display: flex; gap: 6px; align-items: center; padding: 10px; border-bottom: 1px solid var(--line); }
  #chatpanel select { flex: 1; min-width: 0; }
  #chatlog { flex: 1; overflow: auto; padding: 10px 12px; font-size: 13.5px; }
  #chatlog .u { background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; margin: 10px 0 6px auto; max-width: 90%; white-space: pre-wrap; width: fit-content; }
  #chatlog .a { margin: 6px 0; } #chatlog .a p { margin: 0 0 8px; }
  #chatlog .tl2 { color: var(--muted); font-size: 11.5px; margin: 2px 0; }
  #chatlog .res { color: var(--muted); font-size: 11px; margin: 2px 0 10px; text-align: right; }
  #chatlog .err { color: var(--bad); font-size: 12.5px; }
  #chatpanel .cfoot { border-top: 1px solid var(--line); padding: 10px; }
  #chatpanel textarea { min-height: 70px; }
  header .chatbtn { margin-left: auto; font-size: 16px; }
  /* routine month grid */
  table.rgrid { border-collapse: collapse; font-size: 11.5px; }
  table.rgrid th, table.rgrid td { border: 1px solid var(--line); padding: 2px 3px; text-align: center; min-width: 26px; }
  table.rgrid th.nm, table.rgrid td.nm { text-align: left; min-width: 180px; position: sticky; left: 0; background: var(--panel); z-index: 1; }
  table.rgrid .we { background: var(--code); color: var(--muted); }
  table.rgrid .hol { background: var(--off); color: var(--bad); }
  table.rgrid .win { background: var(--accent-soft); } table.rgrid .win.done { background: rgba(31, 138, 76, .22); }
  table.rgrid .win.skip { background: var(--code); } table.rgrid .today { outline: 2px solid var(--accent); outline-offset: -2px; }
  table.rgrid td.nm { cursor: pointer; } table.rgrid tr.sel td.nm { color: var(--accent); font-weight: 600; }
  .src { font-size: 14px; } .notebox { margin-top: 6px; } .notebox .n { border-left: 2px solid var(--line); padding: 2px 8px; margin: 4px 0; font-size: 12.5px; white-space: pre-wrap; }
  .notebox .n .when { color: var(--muted); font-size: 11px; display: block; }
  nav.sub { padding-top: 0; } nav.sub button { font-size: 12.5px; padding: 5px 10px; border-radius: 7px; }
  nav.sub button.active { background: var(--accent-soft); }
  textarea.note-editor { min-height: 70vh; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px;
                         line-height: 1.55; tab-size: 4; white-space: pre; overflow: auto; }
  .ok-btn { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 6px; cursor: pointer; padding: 0 6px; }
  .ok-btn:hover { color: var(--ok); border-color: var(--ok); }
  .src-list { font-size: 11.5px; color: var(--muted); margin-top: 8px; } .src-list div { overflow-wrap: anywhere; }
  tr.star td { font-weight: 600; }
  /* sortable tables */
  table.sortable th { cursor: pointer; user-select: none; white-space: nowrap; }
  table.sortable th:hover { color: var(--accent); }
  table.sortable th[data-dir]::after { content: attr(data-dir); margin-left: 3px; font-size: 10px; }
  /* table filter + selection highlight */
  .tfilter { display: flex; gap: 8px; align-items: center; margin: 0 0 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .tfilter input[type=search] { padding: 3px 8px; font-size: 12px; min-width: 160px; }
  .tfilter .cnt { margin-left: auto; }
  td.hl-row, th.hl-row { background: color-mix(in srgb, var(--accent) 10%, transparent) !important; }
  td.hl-col, th.hl-col { background: color-mix(in srgb, var(--accent) 10%, transparent) !important; }
  td.hl-cell { background: color-mix(in srgb, var(--accent) 28%, transparent) !important; outline: 2px solid var(--accent); outline-offset: -2px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--text); font: inherit; }
  pre.log { background: var(--code); padding: 12px; border-radius: 8px; overflow: auto; max-height: 75vh; font-size: 12px; margin: 0; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  /* rongo (the Analects) */
  .rg-text { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", "Noto Serif JP", serif;
             font-size: 22px; line-height: 1.9; letter-spacing: .04em; margin: 6px 0 14px; }
  .rg-books { display: grid; gap: 6px; }
  .rg-book { display: grid; grid-template-columns: 5.5em 1fr 4.5em; gap: 8px; align-items: center; font-size: 13px; }
  .rg-cells { display: flex; flex-wrap: wrap; gap: 3px; }
  .rg-cell { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel);
             font-size: 9px; line-height: 16px; text-align: center; color: var(--muted); cursor: pointer; padding: 0; }
  .rg-cell.read { background: var(--ok); border-color: var(--ok); color: #fff; }
  .rg-cell.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (max-width: 760px) { .rg-text { font-size: 19px; } .rg-book { grid-template-columns: 4.5em 1fr; } .rg-book .cnt { display: none; } }
  /* credit statement split */
  .crtable td, .crtable th { padding: 5px 6px; font-size: 13px; }
  .crtable td.num, .crtable th.num { text-align: right; white-space: nowrap; }
  .crtable tr.crchecked td { background: color-mix(in srgb, var(--ok) 6%, transparent); }
  .crtable td.neg { color: var(--bad); font-weight: 600; }
  #cr-list tr.crcur td { background: var(--accent-soft); } #cr-list td.num, #cr-list th.num { text-align: right; white-space: nowrap; }
  .crtable tr.crexcluded td { opacity: .5; } .crtable tr.crexcluded td.crm { text-decoration: line-through; }
  .crtable .crx { margin-left: 6px; color: var(--muted); }
  .crhint { color: var(--muted); font-size: 11.5px; margin-top: 2px; white-space: normal; }
  .crlink { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-decoration: underline; }
  .crtable .crs { padding: 1px 7px; font-size: 12px; margin: 1px 0; }
  .crtable td.crsplit { white-space: nowrap; } .crtable td.crm { min-width: 12em; }
  .crtable .crs.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .crtable input.crnum { width: 84px; text-align: right; padding: 2px 6px; }
  .crtable input.crmemo { width: 100%; min-width: 140px; padding: 2px 6px; }
  .crcard { color: var(--muted); font-size: 11px; margin-left: 4px; }
  @media (max-width: 760px) { .crcard { display: none; } }
  .crwho { display: inline-block; padding: 0 8px; border-radius: 9px; font-size: 12px; white-space: nowrap; }
  .c-blue { background: rgba(47, 111, 222, .16); } .c-pink { background: rgba(222, 64, 150, .16); }
  .c-green { background: rgba(31, 138, 76, .16); } .c-orange { background: rgba(178, 107, 0, .18); }
  .c-purple { background: rgba(120, 80, 220, .16); } .c-gray { background: var(--code); }
  .tile input.crin { width: 100%; font-size: 18px; font-weight: 650; padding: 2px 6px; font-variant-numeric: tabular-nums; }
  .crbar { position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 6px 0; }
  .crtable .sm-only { display: none; }
  @media (max-width: 760px) { .crtable .sm-hide, .crbar .sm-hide { display: none; }
    .crtable input.sm-only { display: block; width: 100%; min-width: 0; margin-top: 4px; font-size: 16px; }
    /* phone: each row = date / who / shop / check / amount, then the split buttons on a full-width line */
    .crtable tr:first-child { display: none; }
    .crtable tr { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; gap: 4px 8px;
                  align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .crtable td { border: 0; padding: 0; }
    .crtable td.crm { min-width: 0; }
    .crtable td.crsplit { grid-column: 1 / -1; white-space: normal; } }
  #toast { position: fixed; right: 16px; bottom: 16px; background: var(--text); color: var(--bg); padding: 10px 14px;
           border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80vw; }
  #toast.show { opacity: .95; }
</style>
</head>
<body>
<header>
  <h1>Nakama</h1>

  { id: "assignments", label: "割り当て", desc: "Furiwake が毎朝作る「どのリードを誰に割り当てたか」の表。", kind: "assignments" },

  { id: "costs", label: "コスト", desc: "Nakama の実際の利用量（API 換算）と、ライセンスごとの月額の比較。" },
  { id: "settings", label: "設定", desc: "自分用の設定・メンバー表・各エージェントへの追加指示・ナレッジを直接編集する（保存前に書式チェック、旧版は logs/settings-backup/ に保存）。" },

const store = {  // per-browser UI preferences; storage may be unavailable (private mode etc.)
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } },
};
// Two-level navigation: groups on top, the group's tabs below.
const GROUPS = [
  { id: "g-home", label: "ダッシュボード", tabs: ["home"] },
  { id: "g-work", label: "タスク", tabs: ["tasks", "note", "routine", "kihyo"] },
  { id: "g-inbox", label: "対応", tabs: ["action_items", "drafts", "inbox", "memos", "requests"] },
  { id: "g-team", label: "勤怠", tabs: ["attendance", "overtime"] },
  { id: "g-sales", label: "営業", tabs: ["leads", "opportunities", "assignments"] },
  { id: "g-rec", label: "記録", tabs: ["reports", "knowledge", "costs", "log"] },
  // Personal: optional tabs that each instance turns on in fleet.yaml (home NAS: credit; work PC: e.g. career).
  // A group whose tabs are all off is not shown at all.
  { id: "g-personal", label: "Personal", tabs: ["credit", "rongo"] },
  { id: "g-sys", label: "設定", tabs: ["settings", "devreq", "guide"] },
];
const groupOf = tabId => GROUPS.find(g => g.tabs.includes(tabId)) || GROUPS[0];
// Statuses that mean "handled": hidden unless 完了も表示 (an empty list = everything handled)
const DONE_STATUS = new Set(["done", "skipped", "drafted", "closed", "skip"]);
let state = { tab: location.hash.slice(1) || "home", overview: null, selected: {},
              agentsOpen: store.get("agentsOpen") === "1", samples: store.get("samples") !== "0", cache: {}, notifOpen: new Set(), notifAcked: false, notif: null };
const sq = () => "samples=" + (state.samples ? "1" : "0");

// ---------- utilities ----------
async function api(path, body) {
  const opt = { headers: { "X-Nakama-Token": TOKEN } };
  if (body !== undefined) {
    opt.method = "POST";
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(body);
  }
  const res = await fetch(path, opt);
  const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 3500);
}
const fmtTime = ts => new Date(ts * 1000).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
const usd = v => "$" + Number(v || 0).toFixed(2);
const pill = (v, cls) => v ? `<span class="pill ${esc(cls ?? v)}">${esc(v)}</span>` : "";

// Minimal, escape-first Markdown renderer (headings, quotes, lists, code, tables, bold, links-as-text).
function renderMarkdown(src) {
  const lines = esc(src).split(/\r?\n/);
  let out = [], i = 0;
  const inline = s => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("```")) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      out.push(`<pre><code>${buf.join("\n")}</code></pre>`); i++; continue;
    }
    if (/^&gt;/.test(l)) {
      const buf = [];
      while (i < lines.length && /^&gt;/.test(lines[i])) buf.push(inline(lines[i++].replace(/^&gt;\s?/, "")));
      out.push(`<blockquote>${buf.join("<br>")}</blockquote>`); continue;
    }
    if (/^\|.*\|$/.test(l.trim())) {
      const rows = [];
      while (i < lines.length && /^\|.*\|$/.test(lines[i].trim())) rows.push(lines[i++].trim());
      const cells = r => r.slice(1, -1).split("|").map(c => inline(c.trim()));
      const body = rows.filter(r => !/^\|[\s:|-]+\|$/.test(r));
      out.push("<div class='tablewrap'><table>" + body.map((r, k) =>
        "<tr>" + cells(r).map(c => k === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join("") + "</tr>").join("") + "</table></div>");
      continue;
    }
    const h = l.match(/^(#{1,3})\s+(.*)/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*[-*]\s+/.test(l)) {
      const buf = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) buf.push(`<li>${inline(lines[i++].replace(/^\s*[-*]\s+/, ""))}</li>`);
      out.push(`<ul>${buf.join("")}</ul>`); continue;
    }
    if (l.trim() === "" || /^&lt;!--.*--&gt;$/.test(l.trim())) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() !== "" && !/^(#{1,3}\s|```|&gt;|\s*[-*]\s|\|)/.test(lines[i])) buf.push(inline(lines[i++]));
    out.push(`<p>${buf.join("<br>")}</p>`);
  }
  return out.join("\n");
}
function splitFrontMatter(text) {
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  return m ? [m[1], text.slice(m[0].length)] : ["", text];
}
// Draft body without the "do not send" summary block, ready to paste into a mailer.
function sendableBody(text) {
  const [, body] = splitFrontMatter(text);
  return body.replace(/^(>.*\r?\n)+\s*/m, "").trim();
}

// ---------- attendance calendar ----------
const todayIso = () => state.overview ? state.overview.now.slice(0, 10) : "";
const dayHead = d => `<th class="${d.weekend ? "we" : ""} ${d.date === todayIso() ? "today" : ""} ${d.date < todayIso() ? "past" : ""}">${esc(d.label)}<br>${esc(d.wd)}</th>`;
const LEGEND = `<div class="cal-legend"><span><i style="background:var(--off)"></i>終日不在</span>
  <span><i style="background:var(--partial)"></i>一部不在（半休・時間変更・早退）</span><span>枠線 = 今日</span></div>`;

// Full grid for the attendance tab: one row per member, one column per day.
function calendarGrid(cal) {
  if (cal.error) return `<div class="empty">${esc(cal.error)}</div>`;
  const byKey = {};
  cal.entries.forEach(e => (byKey[e.member + "|" + e.date] ||= []).push(e));
  const rows = cal.members.map(m => "<tr>" + `<td class="name">${esc(m.name)}${m.group ? ` <span class="pill">${esc(m.group)}</span>` : ""}</td>` +
    cal.days.map(d => {
      const es = byKey[m.name + "|" + d.date] || [];
      const level = es.some(e => e.level === "off") ? "off" : es.length ? "partial" : "";
      const tip = es.map(e => `${e.kind} ${e.hours}`.trim()).join(" / ");
      return `<td class="${level} ${d.weekend ? "we" : ""} ${d.date < todayIso() ? "past" : ""}" title="${esc(tip)}">${es.length ? esc(es[0].kind.slice(0, 2)) : ""}</td>`;
    }).join("") + "</tr>").join("");
  return `<div class="tablewrap"><table class="cal"><tr><th class="name">メンバー</th>${cal.days.map(dayHead).join("")}</tr>${rows}</table></div>
    ${LEGEND}<div class="cal-legend">Kintai 更新: ${esc((cal.generated || "—").replace("T", " ").slice(0, 16))}（マスにカーソルで詳細）</div>`;
}

// Compact strip for the dashboard: number of people out per day.
function calendarStrip(cal) {
  if (cal.error) return `<div class="empty">${esc(cal.error)}</div>`;
  const cells = cal.days.map(d => {
    const es = cal.entries.filter(e => e.date === d.date);
    const off = new Set(es.filter(e => e.level === "off").map(e => e.member));
    const part = new Set(es.filter(e => e.level !== "off" && !off.has(e.member)).map(e => e.member));
    const cls = off.size ? "off" : part.size ? "partial" : "";
    const tip = [...off].map(n => n + " 終日").concat([...part].map(n => n + " 一部")).join(" / ");
    return `<td class="${cls} ${d.weekend ? "we" : ""}" title="${esc(tip)}">${off.size || part.size ? `${off.size}${part.size ? `<small>+${part.size}</small>` : ""}` : ""}</td>`;
  }).join("");
  return `<div class="tablewrap"><table class="cal"><tr>${cal.days.map(dayHead).join("")}</tr><tr>${cells}</tr></table></div>
    <div class="cal-legend"><span>数字 = 終日不在の人数（+一部不在）</span><span><i style="background:var(--off)"></i>終日あり</span>
    <span><i style="background:var(--partial)"></i>一部のみ</span><span>マスにカーソルで名前</span></div>`;
}

async function fillCalendar(elId, draw, query = "") {
  const el = document.getElementById(elId); if (!el) return;
  try {
    const html = draw(await api("/api/attendance/calendar" + query));
    if (el.dataset.last !== html) { el.innerHTML = html; el.dataset.last = html; }
    state.cache[elId] = html;  // shown instantly on the next re-render instead of "loading"
    const wrap = el.querySelector(".tablewrap"), today = el.querySelector("th.today");
    if (wrap && today && query) wrap.scrollLeft = today.offsetLeft - wrap.querySelector("th").offsetWidth - 8;
  }
  catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// ---------- rendering ----------
// innerHTML normalises markup, so compare against what we wrote last time instead.
function setHTMLCached(id, html) {
  const el = document.getElementById(id);
  if (el && el.dataset.last !== html) { el.innerHTML = html; el.dataset.last = html; }
}
function renderHeader() {
  const o = state.overview; if (!o) return;
  setHTMLCached("hdr", [
    o.owner && `オーナー: ${esc(o.owner)}`,
    `認証: ${esc(o.auth)}`,
    `<a href="#costs" data-tab="costs" style="color:inherit">本日 ${usd(o.spent)} / 予算 ${usd(o.budget)}</a>`,
    `更新 <span id="clock"></span> (${esc(o.timezone)})`,
    o.has_samples && `<label style="cursor:pointer"><input type="checkbox" id="samples-toggle" ${state.samples ? "checked" : ""}> サンプルを表示</label>`,
  ].filter(Boolean).map(s => `<span>${s}</span>`).join(""));
  const clock = document.getElementById("clock");
  if (clock) clock.textContent = o.now.slice(11, 16);  // text-only update: nothing else repaints
  const badge = t => t.badge ? t.badge(o.counts) : 0;
  const feat = t => !t.feature || Boolean((o.features || {})[t.feature]);  // optional tabs, off unless enabled
  const byId = Object.fromEntries(TABS.filter(feat).map(t => [t.id, t]));
  const active = groupOf(state.tab);
  setHTMLCached("nav", "<nav>" + GROUPS.filter(g => g.tabs.some(id => byId[id])).map(g => {
    const n = g.tabs.reduce((a, id) => a + (byId[id] ? badge(byId[id]) : 0), 0);
    return `<button data-tab="${state.groupLast?.[g.id] || g.tabs[0]}" class="${g === active ? "active" : ""}">${g.label}${n ? `<span class="badge">${n}</span>` : ""}</button>`;
  }).join("") + (active.tabs.length > 1 ? `</nav><nav class="sub">` + active.tabs.map(id => {
    const t = byId[id]; if (!t) return ""; const n = badge(t);
    return `<button data-tab="${t.id}" class="${state.tab === t.id ? "active" : ""}">${t.label}${n ? `<span class="badge">${n}</span>` : ""}</button>`;
  }).join("") : "") + "</nav>");
}

// ---------- today's schedule ----------
const toMin = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
function scheduleHtml(sc) {
  const pos = hhmm => (toMin(hhmm) / 1440 * 100).toFixed(2) + "%";
  const now = toMin(sc.now);
  const rows = sc.agents.map(a => `<div class="tl-row"><span class="nm" title="${esc(a.name)}">${esc(a.name)}${a.trigger ? " *" : ""}</span>
    <div class="tl-track">${a.planned.map(t => `<span class="tl-mark ${toMin(t) < now ? "past" : ""}" style="left:${pos(t)}" title="予定 ${t}"></span>`).join("")}
      ${a.runs.map(r => `<span class="tl-run ${r.error ? "err" : ""}" style="left:${pos(r.t)}" title="${r.error ? "エラー" : "実行"} ${r.t}"></span>`).join("")}
      <span class="tl-now" style="left:${pos(sc.now)}"></span></div></div>`).join("");
  const ticks = [0, 3, 6, 9, 12, 15, 18, 21, 24].map(h => `<span style="left:${h / 24 * 100}%">${h}</span>`).join("");
  const next = sc.agents.flatMap(a => a.planned.filter(t => toMin(t) > now).slice(0, 1).map(t => [t, a.name]))
                 .sort().slice(0, 4).map(([t, n]) => `${t} ${esc(n)}`).join(" / ");
  return `<div class="tl">${rows}<div class="tl-axis"><span></span><div class="ticks">${ticks}</div></div></div>
    <div class="cal-legend"><span>○ 予定 ● 実行 <span style="color:var(--bad)">●</span> エラー｜青線 = 今</span>
    <span>* 入力が無い回はスキップ（記録なし）</span><span>次: ${next || "今日はもうありません"}</span></div>`;
}

// ---------- agent flow diagram ----------
// src: what feeds the agent, q: queue key in overview.queues, to: where its output goes.
const FLOW = [
  { name: "furiwake", src: "新規リード", q: "furiwake", to: "sabaki" },
  { name: "sabaki", src: "割当済みリード", q: "sabaki", to: "you" },
  { name: "henji", src: "受信メール", q: "henji", to: "you" },
  { name: "shoudan", src: "メール・会議", to: "crm" },
  { name: "nokori", src: "会議メモ", to: "you" },
  { name: "kintai", src: "勤怠の貼り付け", q: "kintai", to: "you" },
  { name: "kihyo", src: "議事メモ", to: "planner" },
  { name: "coordinator", src: "変更依頼", q: "coordinator", to: "agents" },
];
function flowSvg(o) {
  const byName = Object.fromEntries(o.agents.map(a => [a.name, a]));
  const flow = FLOW.filter(f => byName[f.name]).concat(o.agents.filter(a => !FLOW.some(f => f.name === a.name)).map(a => ({ name: a.name, src: "", to: "you" })));
  const W = 420, rowH = 46, top = 14, H = top * 2 + rowH * flow.length;
  const ax = 128, aw = 150, sx = 318, sw = 96;  // agent column / sink column
  const q = o.queues || {};
  const youWait = (q.you_drafts || 0) + (q.you_actions || 0);
  const sinks = {
    you: { label: "あなた", sub: `下書き ${q.you_drafts || 0}・要対応 ${q.you_actions || 0}`, wait: youWait > 0 },
    crm: { label: "CRM", sub: "商談の更新" }, planner: { label: "Planner", sub: "PA 経由" },
    agents: { label: "全エージェント", sub: "指示を更新" },
  };
  const rowOf = Object.fromEntries(flow.map((f, i) => [f.name, i]));
  const used = [...new Set(flow.map(f => f.to).filter(k => !(k in rowOf)))];  // agent->agent edges need no sink
  const sinkY = {};
  used.forEach(k => {  // centre each sink on the agents that feed it ...
    const ys = flow.map((f, i) => f.to === k ? top + i * rowH + rowH / 2 : null).filter(v => v !== null);
    sinkY[k] = ys.reduce((a, b) => a + b, 0) / ys.length;
  });
  // ... then push them apart so boxes never overlap (min 48px between centres, stay inside the canvas)
  const order = used.slice().sort((a, b) => sinkY[a] - sinkY[b]);
  order.forEach((k, i) => { if (i) sinkY[k] = Math.max(sinkY[k], sinkY[order[i - 1]] + 48); });
  for (let i = order.length - 1; i >= 0; i--) {
    const limit = i === order.length - 1 ? H - 24 : sinkY[order[i + 1]] - 48;
    sinkY[order[i]] = Math.max(24, Math.min(sinkY[order[i]], limit));
  }
  let edges = "", nodes = "", srcs = "";
  flow.forEach((f, i) => {
    const a = byName[f.name], y = top + i * rowH + rowH / 2;
    const wait = f.q ? (q[f.q] || 0) : 0;
    const err = a.last_run && a.last_run.error;
    const cls = a.running ? "run" : err ? "err" : a.enabled ? "" : "off";
    const status = a.running ? "実行中" : err ? "前回エラー" : !a.enabled ? "無効" : a.last_success ? "最終 " + a.last_success.slice(11, 16) : "未実行";
    // input label + edge into the agent (amber when work is waiting)
    if (f.src) {
      srcs += `<text x="4" y="${y + 4}" class="sub">${esc(f.src)}</text>`;
      edges += `<path class="edge ${wait ? "wait" : ""}" d="M96 ${y} L${ax} ${y}"/>`;
      if (wait) edges += `<g class="badge"><rect x="100" y="${y - 9}" width="22" height="18" rx="9"/><text x="111" y="${y + 4}" text-anchor="middle">${wait}</text></g>`;
    }
    if (f.to in rowOf) {  // hand-off to another agent (e.g. furiwake -> sabaki): short vertical link
      const y2 = top + rowOf[f.to] * rowH + rowH / 2;
      edges += `<path class="edge" d="M${ax + 40} ${y + 18} L${ax + 40} ${y2 - 18}"/>`;
    } else {  // edge out to the sink
      const ty = sinkY[f.to], waitOut = f.to === "you" && youWait > 0;
      edges += `<path class="edge ${waitOut ? "wait" : ""}" d="M${ax + aw} ${y} C${ax + aw + 24} ${y}, ${sx - 24} ${ty}, ${sx} ${ty}"/>`;
    }
    nodes += `<g class="node ${cls}"><title>${esc(f.name)}: ${esc(status)}\n${esc((a.schedule_ja || []).join(" / "))}</title>
      <rect x="${ax}" y="${y - 18}" width="${aw}" height="36" rx="9"/>
      <circle cx="${ax + 12}" cy="${y}" r="4.5" fill="${cls === "err" ? "var(--bad)" : cls === "run" ? "var(--accent)" : cls === "off" ? "var(--muted)" : "var(--ok)"}"/>
      <text x="${ax + 22}" y="${y - 2}">${esc(f.name)}</text><text x="${ax + 22}" y="${y + 12}" class="sub">${esc(status)}</text>
      <g class="play" data-run="${esc(f.name)}"><title>${esc(f.name)} を今すぐ実行</title>
        <circle cx="${ax + aw - 16}" cy="${y}" r="11"/><path d="M${ax + aw - 20} ${y - 6} L${ax + aw - 10} ${y} L${ax + aw - 20} ${y + 6} Z"/></g></g>`;
  });
  const sinkSvg = used.map(k => { const sk = sinks[k] || { label: k, sub: "" }, y = sinkY[k];
    return `<g class="sink ${sk.wait ? "wait" : ""}"><rect x="${sx}" y="${y - 20}" width="${sw}" height="40" rx="9"/>
      <text x="${sx + 8}" y="${y - 3}">${esc(sk.label)}</text><text x="${sx + 8}" y="${y + 12}" class="sub">${esc(sk.sub)}</text></g>`; }).join("");
  return `<svg class="flow" viewBox="0 0 ${W} ${H}" role="img" aria-label="エージェントの関係図">${edges}${srcs}${nodes}${sinkSvg}</svg>
    <div class="cal-legend"><span style="color:var(--warn)">━ 待ちあり（数字=件数）</span><span style="color:var(--bad)">□ 前回エラー</span>
    <span style="color:var(--accent)">□ 実行中</span><span>▶ で今すぐ実行</span></div>`;
}

const chat = { id: store.get("chatId") || "", n: 0, timer: 0, chats: [] };
function chatOpen(open) {
  document.body.classList.toggle("chat-open", open); store.set("chatOpen", open ? "1" : "0");
  if (open) loadChats();
}
async function loadChats(selectId) {
  try { chat.chats = (await api("/api/chats")).chats; } catch (e) { toast(e.message); return; }
  if (!chat.chats.length) { await newChat(); return; }
  chat.id = selectId || (chat.chats.some(c => c.id === chat.id) ? chat.id : chat.chats[0].id);
  store.set("chatId", chat.id);
  document.getElementById("chat-select").innerHTML = chat.chats.map(c =>
    `<option value="${esc(c.id)}" ${c.id === chat.id ? "selected" : ""}>${esc(c.title)}（${esc(String(c.created).slice(5, 16).replace("T", " "))}）</option>`).join("");
  chat.n = 0; document.getElementById("chatlog").innerHTML = ""; pollChat();
}
async function newChat() {
  try { const m = await api("/api/chats/new", { model: document.getElementById("chat-model").value }); await loadChats(m.id); }
  catch (e) { toast(e.message); }
}
function chatEventHtml(e) {
  if (e.type === "user") return `<div class="u">${esc(e.text)}</div>`;
  if (e.type === "assistant") return `<div class="a md">${renderMarkdown(e.text)}</div>`;
  if (e.type === "tool") return `<div class="tl2">🔎 ${esc(e.text)}</div>`;
  if (e.type === "result") return `<div class="res">${e.turns} ターン・$${Number(e.cost || 0).toFixed(3)} 推定${e.error ? "・エラー" : ""}</div>`;
  if (e.type === "error") return `<div class="err">⚠ ${esc(e.text)}</div>`;
  return "";
}
async function pollChat() {
  clearTimeout(chat.timer);
  if (!chat.id || !document.body.classList.contains("chat-open")) return;
  const id = chat.id;
  let r;
  try { r = await api(`/api/chats/events?chat=${encodeURIComponent(id)}&after=${chat.n}`); } catch (e) { toast(e.message); return; }
  if (id !== chat.id) return;  // switched chats meanwhile
  const log = document.getElementById("chatlog");
  if (!chat.n && !r.events.length) log.innerHTML = '<div class="empty">リポジトリのことを何でも聞いてください（例: Kihyo の検証関門は何を見ている？）</div>';
  if (r.events.length) {
    if (!chat.n) log.innerHTML = "";
    log.insertAdjacentHTML("beforeend", r.events.map(chatEventHtml).join(""));
    chat.n = r.events[r.events.length - 1].n + 1;
    log.scrollTop = log.scrollHeight;
  }
  document.getElementById("chat-send").disabled = r.running;
  document.getElementById("chat-send").textContent = r.running ? "回答中…" : "送信";
  if (r.running) chat.timer = setTimeout(pollChat, 1200);
}
async function sendChat() {
  const el = document.getElementById("chat-text");
  if (!el.value.trim() || !chat.id) return;
  try { await api("/api/chats/send", { chat: chat.id, text: el.value }); el.value = ""; chat.timer = setTimeout(pollChat, 300); }
  catch (e) { toast(e.message); }
}
document.addEventListener("keydown", ev => {
  if (ev.target.id === "chat-text" && ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); sendChat(); }
});
document.addEventListener("change", ev => { if (ev.target.id === "chat-select") loadChats(ev.target.value); });

// ---------- notification feed ----------
const N_ICON = { created: "🆕", append: "✏️", close: "✅", unclear: "❓", dup: "🗑️", unassigned: "👤",
                 attention: "⚠️", escalated: "🚨", log: "📄", action: "📌", overtime: "🕕" };
const N_LABEL = { created: "起票", append: "追記", close: "Close 候補", unclear: "判別不能で Drop", dup: "重複 Drop",
                  unassigned: "未割当", attention: "要確認", escalated: "エスカレ", log: "ログ", action: "要対応", overtime: "残業申請" };
function notifHtml(r) {
  if (!r.items.length) return `<div class="empty">${r.total ? "すべて確認済みです 🎉" : "通知はありません"}</div>`;
  let group = "", out = "";
  for (const it of r.items) {
    if (it.group !== group) { group = it.group; out += `<div class="ngroup">${esc(group)}</div>`; }
    const open = state.notifOpen.has(it.id);
    out += `<div class="nrow ${it.acked ? "acked" : ""}" data-nid="${it.id}" title="${esc(N_LABEL[it.kind] || it.kind)}">
      <span class="ic">${N_ICON[it.kind] || "•"}</span><span class="tt">${esc(it.title)}</span>
      ${it.acked ? "" : `<button class="ok" data-ack="${it.id}" title="確認した（一覧から消す）">OK</button>`}</div>`;
    if (open) {
      const extra = it.extra.length ? `<ul>${it.extra.map(x => `<li>${esc(x.title)}${x.detail ? ` <span class="muted">→ ${esc(x.detail)}</span>` : ""}
        ${x.link ? ` <a href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">↗</a>` : ""}</li>`).join("")}</ul>` : "";
      const body = it.kind === "log" ? `<div class="md">${renderMarkdown(it.detail)}</div>` : (it.detail ? `<div>${esc(it.detail)}</div>` : "");
      out += `<div class="ndetail"><div class="muted">${esc(N_LABEL[it.kind] || it.kind)}${it.when ? "・" + esc(it.when.replace("T", " ")) : ""}</div>${body}${extra}
        ${it.link ? `<a class="btn" href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">Planner で開く ↗</a>` : ""}
        ${it.path ? `<a class="btn" href="#${esc(it.tab)}" data-openitem="${esc(it.path)}">詳細を開く</a>` : ""}
        ${it.kind === "overtime" ? '<a class="btn" href="#overtime" data-tab="overtime">残業を記録する</a>' : ""}
        <button class="btn" data-assist="notice" data-nid2="${it.id}">🤖 相談</button></div>`;
    }
  }
  if (!r.has_task_url && r.items.some(i => ["created", "append", "close", "unassigned"].includes(i.kind)))
    out += '<div class="cal-legend">Planner へのリンクは設定タブの fleet.yaml に ticketing.task_url を書くと付きます</div>';
  return out;
}

                 m.priority && pill(m.priority), m.stage && pill(m.stage), m.agent && esc(m.agent), m.from && esc(m.from),

async function openFile(path) {
  state.selected[state.tab] = path;
  document.querySelectorAll(".list .item").forEach(el => el.classList.toggle("active", el.dataset.path === path));
  const viewer = document.getElementById("viewer");
  try {
    const f = await api("/api/file?path=" + encodeURIComponent(path));
    const [fm, body] = path.endsWith(".json") ? ["", "```\n" + f.content + "\n```"] : splitFrontMatter(f.content);
    const statusBtns = f.editable_status.map(s => `<button class="btn" data-status="${esc(s)}">${esc(s)} にする</button>`).join("");
    const assistBtn = path.includes("/action_items/") ? '<button class="btn" data-assist="action">🤖 相談</button>' : "";
    let copyBtn = path.includes("/mail/drafts/") ? '<button class="btn primary" id="copy">本文をコピー（要約を除く）</button>' : "";
    if (path.includes("/attendance/outbox/")) {
      // One copy button per "## heading + code block" (Teams post / Loop TSV).
      viewer.blocks = [...f.content.matchAll(/^##\s+(.+)\r?\n+```[^\n]*\n([\s\S]*?)```/gm)].map(m => [m[1].trim(), m[2].trimEnd()]);
      copyBtn = viewer.blocks.map(([h], k) => `<button class="btn primary" data-copyblock="${k}">${esc(h)}をコピー</button>`).join("");
    }
    viewer.innerHTML = `
      <div class="toolbar"><span class="path">${esc(path)}</span>${copyBtn}${assistBtn}${statusBtns}</div>
      ${fm ? `<div class="fm">${esc(fm)}</div>` : ""}
      <div class="md">${renderMarkdown(body)}</div>`;
    viewer.dataset.path = path;
    viewer.dataset.raw = f.content;
  } catch (e) {
    viewer.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

// ---------- sortable tables (all of them, one implementation) ----------
// Tables whose columns are dates/time (calendars, grids) are left alone.
const NOSORT = "table.cal, table.rgrid, .tl table, svg table";
state.sorts = state.sorts || {};
function cellValue(td) {
  if (!td) return "";
  if (td.dataset.sort !== undefined) return td.dataset.sort;
  const sel = td.querySelector("select");
  return (sel ? sel.options[sel.selectedIndex]?.text || "" : td.textContent).trim();
}
function sortKey(v) {
  const t = v.replace(/[⚠↗→★]/g, "").trim();
  let m;
  if ((m = t.match(/^(\d{4})-(\d{2})-(\d{2})/))) return [0, +(m[1] + m[2] + m[3])];          // 2026-11-27
  if ((m = t.match(/^(\d{1,2})\/(\d{1,2})/))) return [0, (+m[1]) * 100 + (+m[2])];          // 11/27
  if ((m = t.match(/^\$?\s*(-?[\d,]+(?:\.\d+)?)/))) return [1, parseFloat(m[1].replace(/,/g, ""))];  // 18営, $1.20, 3
  return t === "" || t === "—" || t === "-" ? [3, ""] : [2, t];
}
function compareKeys(a, b) {
  if (a[0] !== b[0]) return a[0] - b[0];
  return typeof a[1] === "number" ? a[1] - b[1] : String(a[1]).localeCompare(String(b[1]), "ja");
}
function tableId(table) {
  const all = [...document.querySelectorAll("#main table, #chatpanel table")];
  const head = [...(table.rows[0]?.cells || [])].map(c => c.textContent.replace(/[▲▼]/g, "").trim()).join("|");
  return `${state.tab}:${all.indexOf(table)}:${head}`;
}
function sortTable(table, col, dir) {
  const rows = [...table.rows];
  const header = rows.shift();
  if (!header || !header.querySelector("th")) return;
  const groups = [];  // a data row plus any following detail rows (data-attach)
  for (const r of rows) {
    if (r.hasAttribute("data-attach") && groups.length) groups[groups.length - 1].push(r);
    else groups.push([r]);
  }
  groups.sort((g1, g2) => {
    const k1 = sortKey(cellValue(g1[0].cells[col])), k2 = sortKey(cellValue(g2[0].cells[col]));
    if (k1[0] === 3 && k2[0] !== 3) return 1;   // blanks always last
    if (k2[0] === 3 && k1[0] !== 3) return -1;
    return dir === "▲" ? compareKeys(k1, k2) : compareKeys(k2, k1);
  });
  const parent = header.parentNode;
  groups.flat().forEach(r => parent.appendChild(r));
  [...header.cells].forEach((c, i) => { if (i === col) c.dataset.dir = dir; else delete c.dataset.dir; });
}
function enhanceTables(root = document) {
  root.querySelectorAll("#main table, #chatpanel table").forEach(table => {
    reapplyHighlight(table);
    if (table.matches(NOSORT) || table.closest(NOSORT) || table.rows.length < 3 || !table.rows[0].querySelector("th")) return;
    table.classList.add("sortable");
    const saved = state.sorts[tableId(table)];
    if (saved && !table.dataset.sorted) { sortTable(table, saved.col, saved.dir); }
    table.dataset.sorted = "1";
    addFilter(table);
  });
}
document.addEventListener("click", ev => {
  const th = ev.target.closest("table.sortable th");
  if (!th || ev.target.closest("input,select,button,a")) return;
  const table = th.closest("table"), col = th.cellIndex;
  const id = tableId(table);
  const dir = th.dataset.dir === "▲" ? "▼" : "▲";
  state.sorts[id] = { col, dir };
  sortTable(table, col, dir);
  store.set("sorts", JSON.stringify(state.sorts));
});
try { Object.assign(state.sorts, JSON.parse(store.get("sorts") || "{}")); } catch { /* ignore broken storage */ }
// Tables are (re)built with innerHTML all over the app: enhance them whenever #main changes.
new MutationObserver(() => enhanceTables()).observe(document.getElementById("main"), { childList: true, subtree: true });

// ---------- table filter (text + hide completed) ----------
const DONE_LABELS = new Set(["完了", "done", "今月なし", "却下", "実行済み", "昇格済み", "処理済み", "skip", "skipped", "drafted"]);
state.filters = state.filters || {};
try { Object.assign(state.filters, JSON.parse(store.get("filters") || "{}")); } catch { /* ignore */ }
const normText = t => t.normalize("NFKC").toLowerCase();
function statusCol(table) {
  return [...table.rows[0].cells].findIndex(c => /状態|status/i.test(c.textContent));
}
function rowGroups(table) {
  const groups = [];
  [...table.rows].slice(1).forEach(r => {
    if (r.hasAttribute("data-attach") && groups.length) groups[groups.length - 1].push(r); else groups.push([r]);
  });
  return groups;
}
function applyFilter(table) {
  const f = state.filters[tableId(table)] || {};
  const q = normText(f.q || ""), sc = statusCol(table);
  let shown = 0;
  const groups = rowGroups(table);
  groups.forEach(g => {
    const row = g[0];
    const done = f.hideDone && sc >= 0 && DONE_LABELS.has(cellValue(row.cells[sc]));
    const hit = !q || normText(row.textContent).includes(q);
    const visible = hit && !done;
    g.forEach(r => { r.style.display = visible ? "" : "none"; });
    shown += visible ? 1 : 0;
  });
  const bar = table.closest(".tablewrap, .card, .viewer")?.querySelector(`.tfilter[data-for="${CSS.escape(table.dataset.tid)}"] .cnt`);
  if (bar) bar.textContent = `${shown} / ${groups.length} 件`;
}
function addFilter(table) {
  const dataRows = table.rows.length - 1;
  if (table.dataset.filtered || dataRows < 4 || state.tab === "home") return;  // keep the dashboard squares compact
  table.dataset.filtered = "1";
  table.dataset.tid = tableId(table);
  const f = state.filters[table.dataset.tid] || {};
  const hasStatus = statusCol(table) >= 0;
  const bar = document.createElement("div");
  bar.className = "tfilter"; bar.dataset.for = table.dataset.tid;

function filterTarget(el) {

function saveFilter(table, patch) {

// ---------- selection highlight: the clicked cell's row and column ----------
state.hl = state.hl || {};
function clearHighlight(table) { table.querySelectorAll(".hl-row, .hl-col, .hl-cell").forEach(c => c.classList.remove("hl-row", "hl-col", "hl-cell")); }
function paintHighlight(table, ri, ci) {
  clearHighlight(table);
  const row = table.rows[ri]; if (!row) return;
  [...row.cells].forEach(c => c.classList.add("hl-row"));
  [...table.rows].forEach(r => { const c = r.cells[ci]; if (c && r.style.display !== "none") c.classList.add("hl-col"); });
  row.cells[ci]?.classList.add("hl-cell");
}
function reapplyHighlight(table) {
  const h = state.hl[tableId(table)];
  if (h && !table.dataset.hl) { table.dataset.hl = "1"; paintHighlight(table, h.ri, h.ci); }
}
document.addEventListener("click", ev => {
  const td = ev.target.closest("#main td, #chatpanel td");
  if (!td || ev.target.closest("input,select,button,textarea")) return;
  const table = td.closest("table"), ri = td.parentNode.rowIndex, ci = td.cellIndex, id = tableId(table);
  const cur = state.hl[id];
  if (cur && cur.ri === ri && cur.ci === ci) { delete state.hl[id]; clearHighlight(table); return; }  // second click clears
  state.hl[id] = { ri, ci };
  paintHighlight(table, ri, ci);
}, true);  // capture: runs before handlers that re-render, and never blocks them
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { state.hl = {}; document.querySelectorAll("#main table").forEach(clearHighlight); }
});

// ---------- rongo: the Analects, one chapter a day ----------
async function renderRongo(id) {
  const main = document.getElementById("main");
  let r;
  try { r = await api("/api/rongo" + (id ? "?id=" + encodeURIComponent(id) : "")); }
  catch (e) { main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  state.rg = r;
  if (!r.enabled) {
    main.innerHTML = `<div class="card"><h2>論語は無効です</h2><div class="md">config/fleet.yaml に <code>rongo:</code> を追加して
      <code>enabled: true</code> にすると使えます（書き方は config/fleet.example.yaml）。</div></div>`;
    return;
  }
  const c = r.current, g = r.generation || {};
  const pct = r.total ? Math.round(r.read / r.total * 100) : 0;
  const isNext = c.id === r.next_id;
  const note = c.note ? `<div class="md">${renderMarkdown(c.note)}</div>`
    : `<div class="empty" style="text-align:left;padding:8px 0">解説はまだありません。${esc(r.schedule_ja || r.schedule)}に、この先の章の分をまとめて作ります。

    <div class="card"><h2>${esc(c.book_name)}篇 第${c.no}章 <span class="pill">${esc(c.id)}</span>
        ${c.read_on ? `<span class="pill ok">${esc(c.read_on)} に読了</span>` : isNext ? '<span class="pill open">今日の 1 章</span>' : ""}
        <span class="right">${r.prev_id ? `<button class="btn" data-rgid="${esc(r.prev_id)}">◀ 前</button>` : ""}
          ${r.following_id ? `<button class="btn" data-rgid="${esc(r.following_id)}">次 ▶</button>` : ""}
          ${!isNext && r.next_id ? `<button class="btn" data-rgid="">今日の章へ</button>` : ""}</span></h2>
      <div class="rg-text">${esc(c.text)}</div>
      ${note}${genInfo}
      <div class="row" style="margin-top:12px">${c.read_on
        ? `<button class="btn" id="rg-unread" data-id="${esc(c.id)}">未読に戻す</button>`
        : `<button class="btn primary" id="rg-read" data-id="${esc(c.id)}">読んだ</button>`}</div></div>
    <div class="tiles">
      <div class="tile"><div class="label">読んだ章</div><div class="value">${r.read} / ${r.total}</div>
        <div class="meter"><div style="width:${pct}%"></div></div><div class="cal-legend" style="margin:4px 0 0">${pct}%</div></div>
      <div class="tile"><div class="label">連続日数</div><div class="value">${r.streak} 日</div>
        <div class="cal-legend" style="margin:4px 0 0">${r.read_today ? `今日 ${r.read_today} 章読みました` : "今日はまだです"}</div></div>
      <div class="tile"><div class="label">解説が準備済みの未読</div><div class="value">${r.notes_ready} 章</div></div>
    </div>
    <div class="card"><h2>篇ごとの進み具合</h2><div class="rg-books">${r.books.map(b => {
      const n = b.chapters.filter(x => x.read).length;
      return `<div class="rg-book"><span>${esc(b.name)}</span><div class="rg-cells">${b.chapters.map(x =>
        `<button class="rg-cell ${x.read ? "read" : ""} ${x.id === c.id ? "cur" : ""}" data-rgid="${esc(x.id)}" title="${esc(b.name)} 第${x.no}章">${x.no}</button>`).join("")}</div>
        <span class="cnt cal-legend" style="margin:0">${n} / ${b.total}</span></div>`;
    }).join("")}</div>
      <div class="cal-legend">マスを押すとその章を開きます（緑 = 読んだ）。原文: ${esc(r.source)}。書き下し文・現代語訳・教訓は Claude が作ったもので、誤りがあり得ます。</div></div>`;
  if (g.running) { clearTimeout(state.rgPoll); state.rgPoll = setTimeout(() => { if (state.tab === "rongo") renderRongo(c.id); }, 5000); }
}
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-rgid],#rg-read,#rg-unread,#rg-gen");
  if (!t) return;
  if (t.dataset.rgid !== undefined) { await renderRongo(t.dataset.rgid); window.scrollTo(0, 0); return; }
  if (t.id === "rg-read" || t.id === "rg-unread") {
    try {
      await api("/api/rongo/read", { id: t.dataset.id, read: t.id === "rg-read" });
      if (t.id === "rg-read") { toast("読みました。お疲れさまでした"); renderRongo(t.dataset.id); } else renderRongo(t.dataset.id);
    } catch (e) { toast(e.message); }
    return;
  }
  if (t.id === "rg-gen") {
    try { await api("/api/rongo/generate", { id: t.dataset.id }); toast("解説を作っています（1 章 20〜40 秒ほど）"); setTimeout(() => renderRongo(t.dataset.id), 1500); }
    catch (e) { toast(e.message); }
  }
});

async function renderNote(gotoLine) {
  const main = document.getElementById("main");
  main.innerHTML = '<div class="empty">読み込み中…</div>';
  let r;
  try { r = await api("/api/note/raw"); } catch (e) { main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  state.noteMtime = r.mtime; state.noteDirty = false;
  main.innerHTML = `<div class="card"><div class="toolbar row" style="margin-bottom:8px"><span class="path" style="margin-right:auto">${esc(r.path)}</span>
      <span class="cal-legend" id="note-state" style="margin:0">保存済み</span>
      <button class="btn" id="note-reload">再読み込み</button><button class="btn primary" id="note-savebtn">保存（Ctrl+S）</button></div>
    <textarea class="note-editor" id="note-editor" spellcheck="false"></textarea>
    <div class="cal-legend">Tab / Shift+Tab: 字下げ（入れ子）・Ctrl+Enter: 今の行の □ ⇔ ■（記号が無ければ □ を付ける）・Alt+S: ★ を付け外し・Ctrl+S: 保存。
      Obsidian 側で先に保存されていたら、上書きせずに知らせます（バックアップは logs/note-backup/）。</div></div>`;
  const ed = document.getElementById("note-editor");
  ed.value = r.text;
  if (gotoLine !== undefined) {  // jump to the item clicked in the task list
    const pos = r.text.split("\n").slice(0, gotoLine).join("\n").length + (gotoLine ? 1 : 0);
    ed.focus(); ed.setSelectionRange(pos, pos);
    ed.scrollTop = Math.max(0, gotoLine * 20 - ed.clientHeight / 3);
  }
  ed.addEventListener("input", () => { state.noteDirty = true; document.getElementById("note-state").textContent = "未保存の変更あり"; });
  ed.addEventListener("keydown", noteKeys);
}
function lineBounds(v, pos) { const a = v.lastIndexOf("\n", pos - 1) + 1, b = v.indexOf("\n", pos); return [a, b < 0 ? v.length : b]; }
function editLines(ed, fn) {
  const v = ed.value, s0 = ed.selectionStart, s1 = ed.selectionEnd;
  const a = lineBounds(v, s0)[0], b = lineBounds(v, s1)[1];
  const out = v.slice(a, b).split("\n").map(fn).join("\n");
  ed.value = v.slice(0, a) + out + v.slice(b);
  ed.setSelectionRange(a, a + out.length); ed.dispatchEvent(new Event("input"));
}
function noteKeys(ev) {
  const ed = ev.target;
  if (ev.key === "Tab") {
    ev.preventDefault();
    if (ed.selectionStart === ed.selectionEnd && !ev.shiftKey) {  // plain Tab: insert a tab (nesting)
      const p0 = ed.selectionStart; ed.setRangeText("\t", p0, p0, "end"); ed.dispatchEvent(new Event("input")); return;
    }
    editLines(ed, l => ev.shiftKey ? l.replace(/^\t/, "") : "\t" + l);
  } else if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) {
    ev.preventDefault();
    const keep = ed.selectionStart;
    editLines(ed, l => /[□■]/.test(l.slice(0, 30)) ? l.replace(/[□■]/, m => m === "□" ? "■" : "□") : l.replace(/^(\t*)/, "$1□"));
    ed.setSelectionRange(keep, keep);
  } else if (ev.altKey && (ev.key === "s" || ev.key === "S")) {
    ev.preventDefault();
    const keep = ed.selectionStart;
    editLines(ed, l => l.includes("★") ? l.replace("★", "") : l.replace(/^(\t*)/, "$1★"));
    ed.setSelectionRange(keep, keep);
  } else if (ev.key === "s" && (ev.ctrlKey || ev.metaKey)) {
    ev.preventDefault(); saveNote();
  }
}
async function saveNote() {
  const ed = document.getElementById("note-editor"); if (!ed) return;
  try { const r = await api("/api/note/save", { text: ed.value, mtime: state.noteMtime });
        state.noteMtime = r.mtime; state.noteDirty = false; document.getElementById("note-state").textContent = "保存しました"; toast("ノートを保存しました"); }
  catch (e) { toast(e.message); document.getElementById("note-state").textContent = "保存できません: " + e.message; }
}

async function openJob(job) {
  state.selected.kihyo = job;
  document.querySelectorAll("[data-job]").forEach(el => el.classList.toggle("active", el.dataset.job === job));
  const v = document.getElementById("kh-viewer"); if (!v) return;
  let j;
  try { j = await api("/api/kihyo/job?job=" + encodeURIComponent(job)); } catch (e) { v.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const [l, c] = JOB_JA[j.status] || [j.status, ""];
  let html = `<div class="toolbar"><span class="path">${esc(j.meta.label || job)}</span>${pill(l, c)}</div>`;
  if (j.status === "running") html += '<div class="empty">Claude が draft を作成中です（数分）。このページは自動では更新されないので、少ししたらもう一度ジョブを押してください。</div>';
  if (j.input) html += `<details><summary class="muted">入力</summary><pre class="log">${esc(j.input)}</pre></details>`;
  const val = j.validation;
  if (val) {
    if (val.errors.length) html += `<div class="attn" style="background:var(--off)">${val.errors.map(esc).join("<br>")}</div>`;
    const row = (x, kind) => {
      const blocked = x.errors.length > 0, def = !blocked && !x.warnings.length && j.status !== "promoted";
      return `<tr><td><input type="checkbox" data-pick="${kind}" value="${x.index}" ${def ? "checked" : ""} ${blocked || j.status === "promoted" || j.meta.mode === "cycle" ? "disabled" : ""}></td>
        <td>${esc(x.title)}<div class="cal-legend" style="margin:2px 0 0">${esc(x.assignee || "")} ${esc(x.due || "")} ${esc(x.priority || "")} ${esc(x.note || "")}</div>
        ${x.errors.map(e => `<div style="color:var(--bad);font-size:12px">✗ ${esc(e)}</div>`).join("")}
        ${x.warnings.map(w => `<div style="color:var(--warn);font-size:12px">⚠ ${esc(w)}</div>`).join("")}</td></tr>`;
    };
    html += `<h3>新規タスク ${val.tasks.length} 件</h3><div class="tablewrap"><table>${val.tasks.map(x => row(x, "t")).join("") || "<tr><td>なし</td></tr>"}</table></div>
      <h3>追記・Close 候補 ${val.closes.length} 件</h3><div class="tablewrap"><table>${val.closes.map(x => row(x, "c")).join("") || "<tr><td>なし</td></tr>"}</table></div>
      <div class="cal-legend">照合元: ${esc(val.state_file || "—")}｜✗ は昇格不可、⚠ は既定で外してあります（確認して自分でチェックすれば起票可）</div>`;
    if (j.dropped.length) html += `<h3>Claude が Drop したもの ${j.dropped.length} 件</h3><ul>${j.dropped.map(d => `<li>${esc(d.title || d)} <span class="muted">${esc(d.kind || "")} ${esc(d.reason || "")}</span></li>`).join("")}</ul>`;
    if (j.compare) html += `<h3>アプリ版 draft との比較（${esc(j.compare.file)}）</h3><div class="cal-legend">アプリ版: 新規 ${j.compare.tasks.length} 件 / 追記・Close ${j.compare.closes.length} 件</div>
      <ul>${j.compare.tasks.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`;
    if (j.status === "promoted") html += `<div class="attn" style="background:var(--accent-soft)">昇格済み: ${esc(j.promoted.promoted)}（新規 ${j.promoted.tasks}・追記/Close ${j.promoted.closes}）${j.promoted.archived ? " / 退避: " + esc(j.promoted.archived) : ""}</div>`;
    else if (j.meta.mode !== "cycle" && !val.errors.length) html += `<div style="margin-top:10px"><button class="btn primary" id="kh-approve" data-job="${esc(job)}">チェックした項目を起票する</button></div>`;
  } else if (j.status === "failed") html += '<div class="empty">draft が作られませんでした。ログタブで kihyo の行を確認してください。</div>';
  v.innerHTML = html;
}

async function refreshOverview(force = false) {
  let o;
  try { o = await api("/api/overview?" + sq()); }
  catch (e) { toast("サーバーに接続できません: " + e.message); return; }
  const key = JSON.stringify({ ...o, now: o.now.slice(0, 10) });  // ignore the clock, keep the date
  const changed = force || key !== state.overviewKey;
  state.overview = o; state.overviewKey = key;
  renderHeader();                                   // only patches what differs (see setHTML)
  if (changed && state.tab === "home") renderHome();
}

  }
  if (t.id === "pf-save") {
    try { await api("/api/profile", { name: document.getElementById("pf-name").value, signature: document.getElementById("pf-sign").value });
          toast("プロフィールを保存しました"); await refreshOverview(true); } catch (e) { toast(e.message); }
    return;
  }
  if (t.id === "notify-test") {
    try { const r = await api("/api/notify/test", {}); toast(`Slack: ${r.slack ? "送信" : "未設定/失敗"}・Teams: ${r.teams ? "送信" : "未設定/失敗"}`); } catch (e) { toast(e.message); }
    return;
  }
  if (t.id === "ot-add") {
    const v = id => document.getElementById(id).value;
    try { const r = await api("/api/overtime/add", { date: v("ot-date"), start: v("ot-start"), end: v("ot-end"), reason: v("ot-reason") });
          await navigator.clipboard.writeText(r.text).catch(() => {}); toast("記録しました（申請文をコピーしました）"); renderOvertime(); } catch (e) { toast(e.message); }
    return;
  }
  if (t.dataset.omonth !== undefined) { state.omonth = t.dataset.omonth; renderOvertime(); return; }
  if (t.dataset.otcopy !== undefined) {
    try { await navigator.clipboard.writeText(state.otRows[Number(t.dataset.otcopy)].text); toast("申請文をコピーしました"); } catch { toast("コピーできませんでした"); }
    return;
  }
  if (t.dataset.otdel !== undefined) {
    const x = state.otRows[Number(t.dataset.otdel)];
    if (!confirm(`${x.date} ${x.start}〜${x.end} の記録を削除しますか？`)) return;
    try { await api("/api/overtime/delete", { date: x.date, start: x.start }); renderOvertime(); } catch (e) { toast(e.message); }
    return;
  }
  if (t.id === "memo-hist") { state.memoHist = !state.memoHist; renderMemos(); return; }
  if (t.id === "r-due-save" || t.id === "r-due-reset") {
    const due = t.id === "r-due-reset" ? "" : document.getElementById("r-due").value;
    try { await api("/api/tasks/due", { source: "routine", id: state.rsel, month: state.rmonth, due }); toast(due ? "この月の期日を変更しました" : "規則どおりに戻しました"); renderRoutine(); }
    catch (e) { toast(e.message); }
    return;
  }
  if (t.dataset.taskdue !== undefined) {
    ev.stopPropagation();
    const r = state.taskRows[Number(t.dataset.taskdue)];
    const due = prompt(`「${r.title}」の期日（YYYY-MM-DD、空欄で解除）`, r.due || todayIso());
    if (due === null) return;
    try { await api("/api/tasks/due", { source: r.source, id: r.id, month: r.month, line: r.line, raw: r.raw, due: due.trim() });
          toast(r.source === "note" ? "ノートに 📅 を書き込みました" : "期日を変更しました"); state.cache.tasklist = ""; renderTasks(); }
    catch (e) { toast(e.message); }
    return;
  }
  if (t.id === "dq-view") { state.dqNotes = !state.dqNotes; renderDevreq(); return; }
  if (t.id === "dq-save") {
    const v = id => document.getElementById(id).value;
    try { await api("/api/devreq/update", { id: t.dataset.id, change: v("dq-change"), usage: v("dq-usage"), note: v("dq-note") }); toast("保存しました"); renderDevreq(); }
    catch (e) { toast(e.message); }
    return;
  }
  if (t.dataset.dqrow && !ev.target.closest("select")) { state.dqOpen = state.dqOpen === t.dataset.dqrow ? "" : t.dataset.dqrow; renderDevreq(); return; }
  if (t.id === "dq-add") {
    try { await api("/api/devreq/add", { text: document.getElementById("dq-text").value }); toast("追加しました"); renderDevreq(); }
    catch (e) { toast(e.message); }
    return;
  }
  if (t.dataset.tmonth !== undefined) { state.tmonth = t.dataset.tmonth; state.cache.tasklist = ""; renderTasks(); return; }
  if (t.id === "show-done") { state.showDone = t.checked; render(); return; }
  if (t.dataset.goroutine) { ev.preventDefault(); state.rsel = t.dataset.goroutine; state.rmonth = t.dataset.gomonth; state.tab = "routine"; location.hash = "routine"; render(); return; }
  if (t.dataset.gonote !== undefined) { ev.preventDefault(); state.tab = "note"; location.hash = "note"; renderHeader(); renderNote(Number(t.dataset.gonote)); return; }
  if (t.id === "note-reload") { if (!state.noteDirty || confirm("未保存の変更を捨てて読み込み直しますか？")) renderNote(); return; }
  if (t.id === "note-savebtn") { saveNote(); return; }
  if (t.dataset.taskdone !== undefined) {
    ev.stopPropagation();
    const r = state.taskRows[Number(t.dataset.taskdone)], done = t.dataset.done === "1";
    try { await api("/api/tasks/done", { source: r.source, id: r.id, month: r.month, line: r.line, raw: r.raw, done });
          toast(done ? (r.source === "note" ? "ノートを ■ にしました" : "完了にしました") : "未完了に戻しました"); state.cache.tasklist = ""; renderTasks(); }
    catch (e) { toast(e.message); }
    return;
  }
  if (t.id === "nt-add") {
    const text = document.getElementById("nt-text").value, star = document.getElementById("nt-star").checked;
    try { const r = await api("/api/note/add", { text, star }); toast(`ノートの「${r.section || "先頭"}」に追加しました`); state.cache.tasklist = ""; renderTasks(); }
    catch (e) { toast(e.message); }
    return;
  }
  if (t.dataset.assist) {
    ev.stopPropagation();
    const kind = t.dataset.assist;
    if (kind === "task") { const r = state.taskRows[Number(t.dataset.row)]; assist("task", { title: r.title, source: r.source, due: r.due, status: r.status, memo: r.memo || r.section || "", key: r.key }); }
    else if (kind === "notice") { const n = (state.notif?.items || []).find(x => x.id === t.dataset.nid2) || {}; assist("notice", { kind: n.kind, title: n.title, detail: n.detail + (n.extra || []).map(x => `\n- ${x.title} → ${x.detail}`).join("") }); }
    else if (kind === "action") { const v = document.getElementById("viewer"); assist("notice", { kind: "action", title: v.dataset.path, detail: v.dataset.raw }); }
    else assist("overall", {});
    return;
  }
  if (t.dataset.rid) { openRoutine(t.dataset.rid); return; }
  if (t.dataset.rmonth) { state.rmonth = t.dataset.rmonth; renderRoutine(); return; }
  if (t.id === "r-all") { state.rall = t.checked; renderRoutine(); return; }
  if (t.dataset.rstatus) {
    try { await api("/api/routines/status", { id: state.rsel, month: state.rmonth, status: t.dataset.rstatus }); toast("状態を更新しました"); renderRoutine(); }
    catch (e) { toast(e.message); }
    return;
  }
  if (t.id === "h-add" || t.id === "h-import" || t.dataset.hdel) {
    const v = id => (document.getElementById(id) || {}).value || "";
    try {
      if (t.id === "h-add") await api("/api/holidays/save", { date: v("h-date"), name: v("h-name"), note: v("h-note") });
      else if (t.id === "h-import") { if (!confirm("内閣府の公式 CSV をダウンロードして国民の祝日を取り込みます。")) return;
        const r = await api("/api/holidays/import", {}); toast(`追加 ${r.added} 件（合計 ${r.total} 件）`); }
      else { if (!confirm(`${t.dataset.hdel} を祝日一覧から削除しますか？`)) return; await api("/api/holidays/delete", { date: t.dataset.hdel }); }
      renderRoutine();
    } catch (e) { toast(e.message); }
    return;
  }
  if (t.dataset.note && !ev.target.closest("a")) {
    if (state.tab === "home") { state.tab = "tasks"; location.hash = "tasks"; await render(); }
    openNotes(t.dataset.note, t.dataset.notetitle); return;
  }
  if (t.id === "note-save") {
    const box = document.getElementById("notebox"), text = (document.getElementById("note-text") || {}).value || "";
    try { await api("/api/notes/add", { key: box.dataset.key, text, title: box.dataset.title }); toast("メモを保存しました"); openNotes(box.dataset.key, box.dataset.title); }
    catch (e) { toast(e.message); }
    return;
  }
  if (t.id === "chat-toggle") { chatOpen(!document.body.classList.contains("chat-open")); return; }
  if (t.id === "chat-close") { chatOpen(false); return; }
  if (t.id === "chat-new") { newChat(); return; }
  if (t.id === "chat-send") { sendChat(); return; }
  if (t.id === "memo-save") { saveMemo(); return; }
  if (t.dataset.memoOpen) { state.selected.memos = t.dataset.memoOpen; state.tab = "memos"; location.hash = "memos"; render(); return; }
  if (t.dataset.memo) { openMemo(t.dataset.memo); return; }
  if (t.dataset.memoapply !== undefined || t.dataset.memodismiss !== undefined) {
    const apply = t.dataset.memoapply !== undefined, index = Number(apply ? t.dataset.memoapply : t.dataset.memodismiss);
    if (apply && !confirm(`この提案を実行しますか？（${t.textContent}）`)) return;
    try {
      const r = await api("/api/memo/apply", { memo: state.selected.memos, index, action: apply ? "apply" : "dismiss" });
      toast(r.job ? `起票タブにジョブ ${r.job} を作りました（draft 作成中）` : apply ? "実行しました" : "却下しました");
      openMemo(state.selected.memos);
    } catch (e) { toast(e.message); }
    return;
  }
  if (t.id === "kh-approve") {
    const pick = kind => [...document.querySelectorAll(`[data-pick="${kind}"]:checked`)].map(el => Number(el.value));
    const tasks = pick("t"), closes = pick("c");
    if (!tasks.length && !closes.length) { toast("起票する項目をチェックしてください"); return; }
    if (!confirm(`新規 ${tasks.length} 件・追記/Close ${closes.length} 件を Planner に起票します（Power Automate が動きます）。よろしいですか？`)) return;
    try { const r = await api("/api/kihyo/approve", { job: t.dataset.job, tasks, closes, confirm: true });
          toast(`起票しました: ${r.promoted}${r.archived ? "（前の分を退避: " + r.archived + "）" : ""}`); renderKihyo(); }
    catch (e) { toast(e.message); }
    return;
  }
  if (t.dataset.mode) {
    const body = { mode: t.dataset.mode, text: (document.getElementById("kh-text") || {}).value || "", cycle: t.dataset.cycle || "" };
    if (body.mode === "cycle" && !confirm(`今日の ${body.cycle} サイクルを昇格なしで再現します（サブスク枠を消費、数分）。`)) return;
    try { const r = await api("/api/kihyo/manual", body); state.selected.kihyo = r.job; toast("draft の作成を始めました（数分）"); renderKihyo(); }
    catch (e) { toast(e.message); }
    return;
  }
  if (t.dataset.job) { openJob(t.dataset.job); return; }
  if (t.dataset.klog) {
    document.querySelectorAll("[data-klog]").forEach(el => el.classList.toggle("active", el.dataset.klog === t.dataset.klog));
    try { const r = await api("/api/kihyo/log?name=" + encodeURIComponent(t.dataset.klog)); document.getElementById("kh-log").innerHTML = renderMarkdown(r.content); }
    catch (e) { toast(e.message); }
    return;
  }
  if (t.dataset.ack) {
    ev.stopPropagation();
    try { await api("/api/notifications/ack", { ids: [t.dataset.ack] }); } catch (e) { toast(e.message); }
    loadNotifications(); return;
  }
  if (t.id === "ack-all") {
    const ids = (state.notif?.items || []).filter(i => !i.acked).map(i => i.id);
    if (!ids.length) return;
    try { await api("/api/notifications/ack", { ids }); toast(`${ids.length} 件を確認済みにしました`); } catch (e) { toast(e.message); }
    loadNotifications(); return;
  }
  if (t.id === "notif-acked") { state.notifAcked = t.checked; loadNotifications(); return; }
  if (t.dataset.nid) {
    state.notifOpen.has(t.dataset.nid) ? state.notifOpen.delete(t.dataset.nid) : state.notifOpen.add(t.dataset.nid);
    if (state.notif) { const el = document.getElementById("escbox"); el.innerHTML = notifHtml(state.notif); el.dataset.last = el.innerHTML; }
    return;
  }
  if (t.dataset.openitem) { ev.preventDefault(); state.selected.action_items = t.dataset.openitem; state.tab = "action_items"; location.hash = "action_items"; render(); return; }
  if (t.id === "tasks-done") { state.tasksDone = t.checked; state.cache.tasklist = ""; renderTasks(); return; }
  if (t.id === "samples-toggle") {
    state.samples = t.checked; store.set("samples", state.samples ? "1" : "0"); await refreshOverview(); render(); return;
  }
  if (t.dataset.setting) { openSetting(t.dataset.setting); return; }
  if (t.id === "setting-save") {
    const path = document.getElementById("viewer").dataset.path;
    try { toast((await api("/api/settings/save", { path, content: document.getElementById("setting-text").value })).message); await refreshOverview(); }
    catch (e) { toast("保存できません: " + e.message); }
    return;
  }
  if (t.id === "agents-toggle") {
    state.agentsOpen = !state.agentsOpen; store.set("agentsOpen", state.agentsOpen ? "1" : "0"); renderHome(); return;
  }
  if (t.dataset.copyblock !== undefined) {
    const [, text] = document.getElementById("viewer").blocks[Number(t.dataset.copyblock)];
    try { await navigator.clipboard.writeText(text); toast("コピーしました"); }
    catch { toast("コピーできませんでした（ブラウザの権限を確認）"); }
    return;
  }
  if (t.id === "att-add" || t.id === "att-paste") {
    const v = id => document.getElementById(id).value;
    try {
      const r = t.id === "att-add"
        ? await api("/api/attendance/mine", { date: v("att-date"), kind: v("att-kind"), hours: v("att-hours"), memo: v("att-memo") })
        : await api("/api/attendance/paste", { source: v("att-source"), text: v("att-text") });
      toast("保存: " + r.path); render();
    } catch (e) { toast(e.message); }
    return;
  }
  if (t.dataset.tab) {
    state.tab = t.dataset.tab; (state.groupLast ||= {})[groupOf(state.tab).id] = state.tab;
    location.hash = state.tab; render(); return;
  }
  if (t.dataset.run) {
    if (!confirm(`${t.dataset.run} を今すぐ実行しますか？（API 利用 / サブスク枠を消費します）`)) return;
    t.disabled = true;
    try { toast((await api("/api/run", { agent: t.dataset.run })).message); }
    catch (e) { toast(e.message); t.disabled = false; }
    setTimeout(refreshOverview, 1500);
    return;
  }
  if (t.dataset.path && t.classList.contains("item")) { openFile(t.dataset.path); return; }
  if (t.dataset.status) {
    const path = document.getElementById("viewer").dataset.path;
    try { await api("/api/status", { path, status: t.dataset.status }); toast(`status: ${t.dataset.status}`); await refreshOverview(); render(); }
    catch (e) { toast(e.message); }
    return;
  }
  if (t.id === "copy") {
    try { await navigator.clipboard.writeText(sendableBody(document.getElementById("viewer").dataset.raw)); toast("コピーしました"); }
    catch { toast("コピーできませんでした（ブラウザの権限を確認）"); }
    return;
  }
  if (t.id === "reqsend") {
    const text = document.getElementById("reqtext").value;
    try { const r = await api("/api/request", { text }); toast("作成: " + r.path); await refreshOverview(); render(); }
    catch (e) { toast(e.message); }
    return;
  }
  if (t.id === "logreload") renderLog();
});
window.addEventListener("hashchange", () => { state.tab = location.hash.slice(1) || "home"; render(); });

refreshOverview().then(render);
setInterval(refreshOverview, 15000);  // keep agent status / counts fresh
</script>
</body>
</html>

services:
  nakama:
    build:
      context: .
      target: app
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        GIT_COMMIT: ${GIT_COMMIT:-}            # set by scripts/nas-autodeploy.sh (shown in the footer)
        GIT_COMMIT_DATE: ${GIT_COMMIT_DATE:-}
        GIT_REPO_URL: ${GIT_REPO_URL:-}        # to link "#17" in the 要望 tab to the pull request
    image: nakama:local
    container_name: nakama
    restart: unless-stopped        # comes back after reboot as long as Docker starts
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    # Low-RAM NAS: one agent run (bundled Claude Code CLI) needs a few hundred MB. Uncomment to cap it.
    # mem_limit: 1g
    logging:                       # keep docker logs from filling a small NAS disk
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    volumes:
      # Everything personal lives on the host, so rebuilding the image never loses data.
      - ./agents:/app/agents
      - ./config:/app/config
      - ./knowledge:/app/knowledge
      - ./workspace:/app/workspace
      - ./logs:/app/logs
    # Dashboard at http://localhost:8765 . Inside the container it must bind 0.0.0.0;
    # the port mapping below keeps it reachable from this host only.
    command: ["serve", "--ui", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8765:8765"
      # NAS / LAN access: use "8765:8765" and set NAKAMA_UI_PASSWORD + NAKAMA_UI_ALLOW_HOSTS in .env

  # Optional: implements 要望 marked 着手OK and opens draft pull requests (docs/GUIDE.md「要望の実装」).
  # Starts only with COMPOSE_PROFILES=devbox in .env (first: mkdir -p workspace/devq devbox secrets, not as root).
  # It sees no household data: only the job queue,
  # its own clone of the repository and the secrets/ folder (GitHub token, root-only).
  devbox:
    profiles: ["devbox"]
    build:
      context: .
      target: devbox
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: nakama-devbox:local
    container_name: nakama-devbox
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}   # only the Claude credential, not the whole .env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEVBOX_UID: ${UID:-1000}                               # queue files stay readable by the dashboard
      DEVBOX_GID: ${GID:-1000}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # mem_limit: 2g
    volumes:
      - ./workspace/devq:/queue
      - ./devbox:/work
      - ./secrets:/run/devbox:ro

# Nakama fleet definition.
# Copy to config/fleet.yaml (`python -m nakama init` does this) and edit.
# config/fleet.yaml is gitignored, so personal values never get committed.

timezone: Asia/Tokyo

# Which credential the agents use:
#   auto         -> subscription if CLAUDE_CODE_OAUTH_TOKEN is set, otherwise ANTHROPIC_API_KEY
#   api_key      -> pay-as-you-go API billing (ANTHROPIC_API_KEY)
#   subscription -> your own Claude Pro/Max plan via `claude setup-token` (CLAUDE_CODE_OAUTH_TOKEN)
auth: auto

owner:
  name: "Your Name"
  member_id: me            # must match a member id in config/team.yaml
  signature: "Your Name / Your Company"
  # When `chat` is an MCP connector, only this Slack user may request changes.
  slack_user_id: ""

limits:
  # Hard stop for the whole fleet per calendar day (sum of run costs in logs/costs.jsonl).
  daily_budget_usd: 5.0
  # How late a missed run (PC asleep etc.) may still start, in seconds.
  misfire_grace_seconds: 3600

notify:
  # Env var holding a Slack Incoming Webhook URL. Leave the env var unset to disable.
  slack_webhook_env: SLACK_WEBHOOK_URL
  # Env var holding a Teams "Workflows" webhook URL (post to a chat/channel). Unset = disabled.
  teams_webhook_env: TEAMS_WEBHOOK_URL
  # Optional: Slack user id to mention on action items (e.g. Claude Tag bot "U0XXXX").
  action_item_mention: ""

# Optional: meeting-notes -> Planner ticket pipeline in a synced folder (agent `kihyo`).
# base = synced folder of the pipeline; layout = its sub-folder names (defaults shown)
ticketing:
  base: "C:/path/to/ticket_pipeline"
  layout: {tickets: tickets, state: planner_state, minutes: minutes, roster: roster/roster.json, logs: logs}
  owner_id: ""            # your id in roster/roster.json (for the dashboard "タスク" tab)
  # Planner link for a task: open any task in Planner, copy its link, replace the task id with {id}.
  # e.g. https://tasks.office.com/<tenant>/Home/Task/{id}
  task_url: ""

# Optional: license scenarios for the "コスト" tab (monthly = base_fee + extra - central_funding).
# included: API-equivalent usage covered by base_fee (null = fully covered); overage_rate: charge per extra $1.
cost_plans:
  - name: "Plan A (flat)"
    base_fee: null
    central_funding: 0
    included: null
    overage_rate: 0

# Optional: a hand-written ToDo note (e.g. Obsidian) shown in the task list and updated in its own notation
# (□ = to do, ■ = done, ★ = highlight). Nakama only flips a box or inserts one "□..." line, with a backup.
todo_note:
  path: ""
  add_section: "ASAP"

# Overtime log + reminder (勤怠 > 残業). The reminder shows on business days from remind_at until today's entry exists.
overtime:
  enabled: true
  remind_at: "18:00"
  template: "【残業申請】{date}（{wd}） {start}〜{end}（{hours}h）
理由: {reason}"

# Credit card statement split (Personal > クレジット精算). Off unless enabled.
# Upload the card company's statement CSV each month, decide per row who pays
# (shared budget by default / member A / member B / half / typed amounts), enter the debit
# account balance, and the tab shows how much each side deposits. Data: workspace/credit/ (git-ignored).
credit:
  enabled: false
  members:                      # exactly two; `match` = how the card member appears in the CSV
    - label: "A"
      color: blue               # blue | pink | green | orange | purple | gray
      match: ["TARO YAMADA"]
    - label: "B"
      color: pink
      match: ["HANAKO YAMADA"]
  shared_label: "共同"           # what pays the rest (e.g. a shared household budget)
  account_label: "引き落とし口座"
  closing_day: 19               # statement closing day; used to name the month (YYYYMM) of an upload
  # exclude: ["前回分口座振替"]    # rows that are not purchases (this one is always excluded); add more if needed
  # csv:                        # extra header names, if your CSV's columns are named differently
  #   date: ["ご利用日"]
  #   merchant: ["ご利用店名"]
  #   amount: ["ご利用金額"]
  #   holder: ["ご利用者"]

# The Analects, one chapter a day (Personal > 論語). Off unless enabled.
# The original text (public domain, ~500 chapters) is downloaded once from ctext.org with a button on the tab.
# Every morning Claude writes 書き下し文 / 現代語訳 / 語句 / 教訓 / 今日の問い for the next few unread chapters
# (one short call per chapter; needs the same Claude credential as the agents). Data: workspace/rongo/.
rongo:
  enabled: false
  schedule: "15 5 * * *"        # when to prepare explanations (cron, fleet timezone)
  ahead: 3                      # how many unread chapters to keep ready
  model: claude-sonnet-5-5

# Where each data source lives.
#   local        -> files under workspace/ (default; works with zero integrations)
#   mcp:<name>   -> MCP server <name> defined in config/mcp.json
connectors:
  crm: local          # leads + opportunities   (e.g. mcp:salesforce)
  mail: local         # inbox / sent / drafts   (e.g. mcp:gmail)
  calendar: local     # meetings + transcripts  (e.g. mcp:gcal)
  chat: local         # change requests, reports (e.g. mcp:slack)
  attendance: local   # team attendance posts   (Teams thread / Loop pastes)

# Cron format: "minute hour day month day_of_week".
# Use day NAMES (mon-fri). Numeric weekdays differ between cron and APScheduler.
agents:
  furiwake:
    enabled: true
    skip_holidays: true        # weekday job: holidays from config/holidays.json
    model: claude-sonnet-5-5     # follows a written rulebook -> smaller model is enough
    effort: low
    schedule: ["30 7 * * mon-fri"]
    max_turns: 40
    max_budget_usd: 0.50
    connectors: [crm]
    writes: [workspace/crm/leads, workspace/assignments, workspace/reports, workspace/action_items]

  sabaki:
    enabled: true
    skip_holidays: true        # weekday job: holidays from config/holidays.json
    model: claude-opus-5-5       # customer-facing writing in JA/EN
    effort: medium
    schedule: ["0 8 * * mon-fri"]
    max_turns: 80
    max_budget_usd: 1.50
    connectors: [crm, mail]
    writes: [workspace/crm/leads, workspace/mail/drafts, workspace/reports, workspace/action_items, knowledge]

  henji:
    enabled: true
    skip_holidays: true        # weekday job: holidays from config/holidays.json
    model: claude-sonnet-5-5     # runs most often -> Sonnet + Opus advisor
    effort: medium
    schedule: ["5 9-18 * * mon-fri"]
    max_turns: 60
    max_budget_usd: 0.80
    connectors: [mail]
    # Skip the run (no API call at all) unless a file here changed since the last successful run.
    # Remove this when mail is an MCP connector (there is nothing local to watch).
    trigger_paths: [workspace/mail/inbox]
    advisor:
      model: claude-opus-5-5
      effort: high
    writes: [workspace/mail/inbox, workspace/mail/drafts, workspace/reports, workspace/action_items, knowledge]

  shoudan:
    enabled: true
    skip_holidays: true        # weekday job: holidays from config/holidays.json
    model: claude-sonnet-5-5     # updates records by a written rulebook
    effort: low
    schedule: ["30 12 * * mon-fri", "30 17 * * mon-fri"]
    max_turns: 50
    max_budget_usd: 0.60
    connectors: [crm, mail, calendar]
    writes: [workspace/crm/opportunities, workspace/reports, workspace/action_items]

  nokori:
    enabled: true
    skip_holidays: true        # weekday job: holidays from config/holidays.json
    model: claude-opus-5-5       # long transcripts, customer-facing output, learning loop
    effort: medium
    schedule: ["30 18 * * mon-fri"]
    max_turns: 80
    max_budget_usd: 1.50
    connectors: [calendar, mail]
    writes: [workspace/calendar, workspace/mail/drafts, workspace/reports, workspace/action_items, knowledge]

  kintai:
    enabled: true
    skip_holidays: true        # weekday job: holidays from config/holidays.json
    model: claude-sonnet-5-5     # structured cross-check -> smaller model is enough
    effort: low
    # Runs only when something under workspace/attendance changed (paste, your own plan, sync).
    schedule: ["45 8 * * mon-fri", "0 10-18 * * mon-fri"]
    max_turns: 40
    max_budget_usd: 0.40
    connectors: [attendance]
    trigger_paths: [workspace/attendance/mine.md, workspace/attendance/sources]
    writes: [workspace/attendance/outbox, workspace/reports, workspace/action_items]

  kihyo:
    enabled: false
    model: claude-opus-5-5       # dedup judgement over messy minutes -> highest care
    effort: high
    schedule: ["0 12,19 * * *"]  # 12:00 = am cycle, 19:00 = pm cycle (every day)
    max_turns: 120
    max_budget_usd: 3.00
    helpers: [ticketing]         # OneDrive wait / planner_state filter / archive / promote tools
    instructions_files: ["~/.claude/scheduled-tasks/<your-routine>/SKILL.md"]
    writes: [workspace/reports, workspace/action_items, workspace/kihyo]

  kikitori:
    enabled: true
    model: claude-sonnet-5-5     # sorting short notes -> smaller model is enough
    effort: low
    schedule: ["*/30 8-20 * * *"]
    max_turns: 30
    max_budget_usd: 0.30
    # Runs only when a memo was added since the last run.
    trigger_paths: [workspace/memos]
    writes: [workspace/kikitori, workspace/memos, workspace/reports]

  coordinator:
    enabled: true
    model: claude-opus-5-5       # edits other agents' instructions -> highest care
    effort: high
    schedule: ["*/15 8-22 * * *"]
    max_turns: 40
    max_budget_usd: 1.00
    connectors: [chat]
    trigger_paths: [workspace/requests, workspace/briefs]
    writes: [agents/furiwake/LOCAL.md, agents/sabaki/LOCAL.md, agents/henji/LOCAL.md,
             agents/shoudan/LOCAL.md, agents/nokori/LOCAL.md, agents/kintai/LOCAL.md, knowledge,
             workspace/requests, workspace/reports, workspace/action_items]

  # Optional per-agent keys:
  #   pin_version: 3                 # run agents/<name>/versions/v003.md instead of LOCAL.md
  #   disallowed_tools: ["mcp__gmail__send_email"]   # block risky MCP tools explicitly
  #   web: true                      # allow WebSearch / WebFetch (default: false)
